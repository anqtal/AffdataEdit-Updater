name: Updater release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updater-release
  cancel-in-progress: false

jobs:
  # Universal arm64/x86_64 binary. A zip keeps its execute permission through browser downloads.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile and check
        run: |
          GOOS=darwin go vet ./...
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "AffdataEdit-Updater-$arch" .
          done
          lipo -create -output AffdataEdit-Updater AffdataEdit-Updater-arm64 AffdataEdit-Updater-amd64
          chmod +x AffdataEdit-Updater
          ditto -c -k AffdataEdit-Updater AffdataEdit-Updater-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: updater-macos
          path: AffdataEdit-Updater-macOS.zip
          retention-days: 1

  release:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile and check
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags="-s -w" -o AffdataEdit-Updater.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: updater-macos
      - name: Checksums
        shell: pwsh
        run: |
          $lines = foreach ($file in "AffdataEdit-Updater.exe", "AffdataEdit-Updater-macOS.zip") {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $file"
          }
          $lines | Set-Content -Encoding utf8NoBOM SHA256SUMS
      - name: Publish latest release and remove previous releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${env:GITHUB_RUN_NUMBER}-${env:GITHUB_RUN_ATTEMPT}"
          gh release create $tag AffdataEdit-Updater.exe AffdataEdit-Updater-macOS.zip SHA256SUMS --target $env:GITHUB_SHA --title "Updater $tag" --notes "Windows x64 and macOS (Apple silicon and Intel). Commit: $env:GITHUB_SHA" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tags = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($old in $tags) {
            if ($old -ne $tag) {
              gh release delete $old --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
